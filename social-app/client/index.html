<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fuzzy — Connect & Share</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-page">

  <!-- LEFT HERO -->
  <div class="auth-hero">
    <div class="auth-hero-logo">Fuzzy</div>
    <p class="auth-hero-text">Share moments, connect with people, and discover what matters.</p>
    <div class="auth-hero-features">
      <div class="auth-feature">
        <div class="auth-feature-icon">📸</div>
        <span>Share photos and thoughts</span>
      </div>
      <div class="auth-feature">
        <div class="auth-feature-icon">❤️</div>
        <span>Like and comment on posts</span>
      </div>
      <div class="auth-feature">
        <div class="auth-feature-icon">👥</div>
        <span>Follow people you love</span>
      </div>
      <div class="auth-feature">
        <div class="auth-feature-icon">🔍</div>
        <span>Discover new creators</span>
      </div>
    </div>
  </div>

  <!-- RIGHT FORM -->
  <div class="auth-right">
    <div class="auth-container">
      <h1 class="auth-title">Welcome to Fuzzy</h1>
      <p class="auth-subtitle">Sign in to your account or create a new one</p>

      <div id="alert-box"></div>

      <div class="auth-tabs">
        <button class="auth-tab active" onclick="switchTab('login', this)">Sign In</button>
        <button class="auth-tab" onclick="switchTab('register', this)">Sign Up</button>
      </div>

      <!-- LOGIN -->
      <div id="tab-login">
        <div class="form-group">
          <label>Email address</label>
          <input type="email" id="login-email" placeholder="you@example.com" onkeydown="if(event.key==='Enter') login()">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="Your password" onkeydown="if(event.key==='Enter') login()">
        </div>
        <button class="btn btn-primary" onclick="login()" id="login-btn">
          Sign In →
        </button>
      </div>

      <!-- REGISTER -->
      <div id="tab-register" style="display:none;">
        <div class="form-group">
          <label>Full name</label>
          <input type="text" id="reg-fullname" placeholder="Your full name">
        </div>
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="reg-username" placeholder="username">
        </div>
        <div class="form-group">
          <label>Email address</label>
          <input type="email" id="reg-email" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="reg-password" placeholder="Create a password" onkeydown="if(event.key==='Enter') register()">
        </div>
        <button class="btn btn-primary" onclick="register()" id="register-btn">
          Create Account →
        </button>
      </div>

    </div>
  </div>

</div>

<script>
  const API = 'http://localhost:5000/api';

  if (localStorage.getItem('token')) window.location.href = 'feed.html';

  const theme = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', theme);

  function switchTab(tab, el) {
    document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('tab-login').style.display = tab === 'login' ? 'block' : 'none';
    document.getElementById('tab-register').style.display = tab === 'register' ? 'block' : 'none';
    document.getElementById('alert-box').innerHTML = '';
  }

  function showAlert(msg, type) {
    document.getElementById('alert-box').innerHTML =
      `<div class="alert alert-${type}">${type === 'error' ? '⚠️' : '✓'} ${msg}</div>`;
    setTimeout(() => document.getElementById('alert-box').innerHTML = '', 4000);
  }

  function setLoading(btnId, loading) {
    const btn = document.getElementById(btnId);
    btn.disabled = loading;
    btn.textContent = loading ? 'Please wait...' : (btnId === 'login-btn' ? 'Sign In →' : 'Create Account →');
  }

  async function login() {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value.trim();
    if (!email || !password) return showAlert('Email and password are required.', 'error');
    setLoading('login-btn', true);
    try {
      const res = await fetch(`${API}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!res.ok) { setLoading('login-btn', false); return showAlert(data.error, 'error'); }
      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
      window.location.href = 'feed.html';
    } catch {
      setLoading('login-btn', false);
      showAlert('Cannot connect to server. Make sure npm run dev is running.', 'error');
    }
  }

  async function register() {
    const full_name = document.getElementById('reg-fullname').value.trim();
    const username = document.getElementById('reg-username').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value.trim();
    if (!username || !email || !password) return showAlert('All fields are required.', 'error');
    if (username.length < 3) return showAlert('Username must be at least 3 characters.', 'error');
    if (password.length < 6) return showAlert('Password must be at least 6 characters.', 'error');
    setLoading('register-btn', true);
    try {
      const res = await fetch(`${API}/auth/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ full_name, username, email, password })
      });
      const data = await res.json();
      if (!res.ok) { setLoading('register-btn', false); return showAlert(data.error, 'error'); }
      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
      window.location.href = 'feed.html';
    } catch {
      setLoading('register-btn', false);
      showAlert('Cannot connect to server. Make sure npm run dev is running.', 'error');
    }
  }
</script>

</body>
</html>
