<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fuzzy — Connect & Vibe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-container">

    <div class="auth-logo">
      <h1>Fuzzy</h1>
      <p>Connect with your world</p>
    </div>

    <div id="alert-box"></div>

    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login', this)">Sign In</button>
      <button class="auth-tab" onclick="switchTab('register', this)">Sign Up</button>
    </div>

    <!-- LOGIN -->
    <div id="tab-login">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="Your password">
      </div>
      <button class="btn btn-primary" onclick="login()">Sign In →</button>
    </div>

    <!-- REGISTER -->
    <div id="tab-register" style="display:none;">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="reg-fullname" placeholder="Your full name">
      </div>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="reg-username" placeholder="username">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="reg-password" placeholder="Create a password">
      </div>
      <button class="btn btn-primary" onclick="register()">Create Account →</button>
    </div>

  </div>
</div>

<script>
const API = 'https://fuzzy-social-app-production.up.railway.app/api';

  if (localStorage.getItem('token')) window.location.href = 'feed.html';

  function switchTab(tab, el) {
    document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('tab-login').style.display = tab === 'login' ? 'block' : 'none';
    document.getElementById('tab-register').style.display = tab === 'register' ? 'block' : 'none';
    document.getElementById('alert-box').innerHTML = '';
  }

  function showAlert(msg, type) {
    document.getElementById('alert-box').innerHTML =
      `<div class="alert alert-${type}">${type === 'error' ? '⚠️' : '✓'} ${msg}</div>`;
    setTimeout(() => document.getElementById('alert-box').innerHTML = '', 4000);
  }

  async function login() {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value.trim();
    if (!email || !password) return showAlert('Email and password are required.', 'error');
    try {
      const res = await fetch(`${API}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!res.ok) return showAlert(data.error, 'error');
      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
      window.location.href = 'feed.html';
    } catch {
      showAlert('Cannot connect to server. Make sure npm run dev is running.', 'error');
    }
  }

  async function register() {
    const full_name = document.getElementById('reg-fullname').value.trim();
    const username = document.getElementById('reg-username').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value.trim();
    if (!username || !email || !password) return showAlert('All fields are required.', 'error');
    try {
      const res = await fetch(`${API}/auth/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ full_name, username, email, password })
      });
      const data = await res.json();
      if (!res.ok) return showAlert(data.error, 'error');
      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
      window.location.href = 'feed.html';
    } catch {
      showAlert('Cannot connect to server. Make sure npm run dev is running.', 'error');
    }
  }
</script>

</body>
</html>
